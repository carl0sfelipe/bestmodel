name: pages

# GitHub Pages deployment (S36): Pages no longer publishes the divergent
# static site. apps/web/site is a frozen archive; the published output is a
# redirect surface to the canonical host, www.bestmodel.run (index + 404
# catch-all, path preserved via the ?p= hint). Retired 2026-09-21 (L04 D5).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/site/**"
      - "apps/web/data/derived/**"
      - "apps/web/data/seed/**"
      - "apps/web/console/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build redirect surface (canonical host: www.bestmodel.run)
        run: |
          set -euo pipefail
          mkdir -p publish
          cat > publish/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://www.bestmodel.run/">
          <link rel="canonical" href="https://www.bestmodel.run/">
          <title>bestmodel.run</title>
          </head>
          <body>
          <p>This address is retired. The canonical site is <a href="https://www.bestmodel.run/">https://www.bestmodel.run</a>.</p>
          </body>
          </html>
          HTML
          cat > publish/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://www.bestmodel.run/">
          <link rel="canonical" href="https://www.bestmodel.run/">
          <title>bestmodel.run</title>
          </head>
          <body>
          <p>Page moved. The canonical site is <a href="https://www.bestmodel.run/">https://www.bestmodel.run</a>.</p>
          </body>
          </html>
          HTML
          touch publish/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
