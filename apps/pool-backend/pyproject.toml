[project]
name = "bestmodel-pool-backend"
version = "0.1.0"
description = "Local backend: sync localmaxxing pool, roofline plausibility, derived export, match API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
