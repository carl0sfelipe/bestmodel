[package]
name = "benchmark-probe"
version = "0.1.0"
edition = "2021"
description = "CLI alpha: local LLM hardware benchmark probe"

[lib]
name = "benchmark_probe"
path = "src/lib.rs"

[[bin]]
name = "benchmark-probe"
path = "src/main.rs"

[dependencies]
# L03A: the TPE optimizer (owner decision 2026-08-30). Vendored at
# third_party/argos-opt: a clean-room RECONSTRUCTION of the lost tree
# 31feea6 (owner-authorized 2026-09-18 — no remote ever existed, no copy
# was recoverable). Swap in the original tree when it resurfaces; the
# goal remains publishing it as a git/registry dep (backlog A11).
argos-opt = { path = "../../third_party/argos-opt" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
# Vendored OpenSSL: static link so the release binary runs on any glibc host
# (bullseye builds carry libssl.so.1.1, breaking on Ubuntu 22.04+ / OpenSSL 3).
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
serde_json = "1"
